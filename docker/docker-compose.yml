# Data/output folders can be overridden in docker/.env, e.g. NNLC_DATA_DIR=Q:/op_rlogs
services:
  tools:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    volumes:
      - ${NNLC_DATA_DIR:-../data}:/app/data
      - ${NNLC_OUTPUT_DIR:-../output}:/app/output

  train:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    volumes:
      - ${NNLC_DATA_DIR:-../data}:/app/data
      - ${NNLC_OUTPUT_DIR:-../output}:/app/output
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
